<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop IHS | Indian Handicraft Standards</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#fffdf9;color:#26333b;font:14px Arial,sans-serif}header{background:#f8f4ed;padding:20px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}a{color:inherit;text-decoration:none}.brand{font:24px Georgia,serif;color:#182b3a}main{max-width:1120px;margin:auto;padding:32px 18px}h1{font:42px Georgia,serif;color:#182b3a}.muted{color:#6b7478;line-height:1.7}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,select{padding:11px;border:1px solid #e6ded1;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #e6ded1}.photo{height:250px;background:#f8f4ed center/cover;display:grid;place-items:center;color:#a88a52;font:26px Georgia,serif}.info{padding:14px}.tag{color:#702d43;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.info h2{font:21px Georgia,serif;color:#182b3a;margin:8px 0}.btn{display:inline-block;background:#182b3a;color:white;padding:12px 15px;margin-top:12px;font-size:12px}.empty{padding:24px;border:1px dashed #e6ded1;grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.photo{height:320px}}</style></head><body><header><a class="brand" href="index.html">Indian Handicraft Standards</a><nav><a href="index.html">Home</a>　<a href="admin-live.html">Admin</a></nav></header><main><div class="tag">Lucknowi Chikankari</div><h1>Shop the collection</h1><p class="muted">Authentic product information will appear here after products are added in the IHS admin panel.</p><div class="filters"><input id="q" placeholder="Search products"><select id="cat"><option value="">All categories</option><option>Kurtis</option><option>Palazzo Sets</option><option>Suits & Dupattas</option><option>Pants & Bottoms</option><option>Other</option></select></div><div class="grid" id="grid"><div class="empty">Loading collection…</div></div></main><script>const cfg=window.IHS_CONFIG||{};const ready=cfg.supabaseUrl&&cfg.supabasePublishableKey&&!cfg.supabasePublishableKey.includes('REPLACE_')&&window.supabase;const grid=document.querySelector('#grid');function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function render(){if(!ready){grid.innerHTML='<div class="empty">Catalogue setup is not complete yet. Please check back soon or contact IHS on WhatsApp.</div>';return}const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data,error}=await client.from('ihs_products').select('id,name,category,description,colour,image_url,price_inr,status').eq('status','active').order('created_at',{ascending:false});if(error){grid.innerHTML='<div class="empty">The catalogue is temporarily unavailable. Please contact IHS for assistance.</div>';return}const q=document.querySelector('#q').value.toLowerCase(),cat=document.querySelector('#cat').value;const rows=(data||[]).filter(p=>(p.name+' '+p.description+' '+p.colour).toLowerCase().includes(q)&&(!cat||p.category===cat));grid.innerHTML='';if(!rows.length){grid.innerHTML='<div class="empty">No products available in this category yet.</div>';return}for(const p of rows){const el=document.createElement('article');el.className='card';const photo=document.createElement('div');photo.className='photo';if(p.image_url){photo.style.backgroundImage='url("'+p.image_url.replace(/"/g,'')+'")'}else photo.textContent='IHS';const info=document.createElement('div');info.className='info';info.innerHTML='<div class="tag">'+esc(p.category)+'</div><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.colour)+' · '+esc(p.description)+'</p><strong>₹'+Number(p.price_inr).toLocaleString('en-IN')+'</strong><br><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(cfg.whatsappNumber||'')+'?text='+encodeURIComponent('Hello IHS, I am interested in '+p.name+'. Please confirm sizes, availability and shipping.')+'">Enquire on WhatsApp</a>';el.append(photo,info);grid.append(el)}}['q','cat'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
