<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Indian Handicraft Standards</title><style>
:root{--ivory:#f8f4ed;--navy:#182b3a;--gold:#a88a52;--maroon:#702d43;--ink:#26333b;--line:#e6ded1}*{box-sizing:border-box}body{margin:0;background:#fffdf9;color:var(--ink);font:14px Arial,sans-serif}header{background:var(--ivory);padding:22px max(20px,calc((100% - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font:24px Georgia,serif;color:var(--navy)}nav{display:flex;gap:18px;flex-wrap:wrap}main{max-width:1160px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}h1{font:42px Georgia,serif;color:var(--navy);margin:0 0 10px}.muted{color:#6e7474;line-height:1.7}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;padding:11px 12px;border:1px solid var(--line);background:white;border-radius:3px}button,.btn{background:var(--navy);color:white;border:0;padding:12px 15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid var(--line);background:white}.photo{height:230px;background:var(--ivory);display:grid;place-items:center;color:var(--gold);font:26px Georgia,serif;background-size:cover;background-position:center}.info{padding:14px}.info h3{font:20px Georgia,serif;color:var(--navy);margin:4px 0 10px}.price{font-weight:bold}.tag{font-size:11px;color:var(--maroon);text-transform:uppercase;letter-spacing:.08em}.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center}.empty{padding:30px;border:1px dashed var(--line);text-align:center;grid-column:1/-1}footer{padding:28px;text-align:center;background:var(--navy);color:white;margin-top:50px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.photo{height:290px}}
</style></head><body><header><a class="brand" href="index.html">Indian Handicraft Standards</a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="admin.html">Store Admin</a></nav></header><main><div class="top"><div><div class="tag">The art of Chikankari</div><h1>Shop the collection</h1><div class="muted">Browse the IHS catalogue. Products added in this preview's admin page appear on this device.</div></div><a class="btn" href="https://wa.me/?text=Hello%20IHS%2C%20please%20help%20me%20choose%20a%20product" target="_blank" rel="noopener">Ask on WhatsApp</a></div><div class="filters"><input id="search" placeholder="Search products…" aria-label="Search products"><select id="category"><option value="">All categories</option><option>Kurtis</option><option>Palazzo Sets</option><option>Suits & Dupattas</option><option>Pants & Bottoms</option></select><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="grid" id="grid"></div></main><footer>Indian Handicraft Standards · Lucknowi Chikankari</footer><script>
const key='ihs-preview-products-v1';const defaults=[{id:'demo-1',name:'Lucknowi Chikankari Kurti',category:'Kurtis',price:1599,color:'Ivory',sizes:'S, M, L, XL, XXL',stock:5,description:'Everyday elegance with delicate Chikankari-inspired detail.',image:''},{id:'demo-2',name:'Kurta Palazzo Set',category:'Palazzo Sets',price:2199,color:'Black',sizes:'S, M, L, XL',stock:5,description:'A coordinated set for effortless occasion dressing.',image:''},{id:'demo-3',name:'Chanderi Shirt & Dupatta',category:'Suits & Dupattas',price:5000,color:'Customisable',sizes:'Customisable',stock:3,description:'A graceful semi-stitched ensemble.',image:''},{id:'demo-4',name:'Cotton Comfort Pants',category:'Pants & Bottoms',price:190,color:'Multiple',sizes:'Free size',stock:10,description:'Easy everyday cotton bottoms.',image:''}];function products(){try{return JSON.parse(localStorage.getItem(key))||defaults}catch{return defaults}}function render(){let p=products(),q=document.querySelector('#search').value.toLowerCase(),c=document.querySelector('#category').value,s=document.querySelector('#sort').value;p=p.filter(x=>(x.name+' '+x.description+' '+x.color).toLowerCase().includes(q)&&(!c||x.category===c));if(s==='low')p.sort((a,b)=>a.price-b.price);if(s==='high')p.sort((a,b)=>b.price-a.price);const grid=document.querySelector('#grid');grid.innerHTML='';if(!p.length){grid.innerHTML='<div class="empty">No products match. Try another search.</div>';return}for(const x of p){const el=document.createElement('article');el.className='card';const photo=document.createElement('div');photo.className='photo';if(x.image){photo.style.backgroundImage='url("'+x.image.replace(/"/g,'')+'")';photo.textContent=''}else photo.textContent='IHS';const info=document.createElement('div');info.className='info';info.innerHTML='<div class="tag">'+escapeHtml(x.category)+'</div><h3>'+escapeHtml(x.name)+'</h3><div class="muted">'+escapeHtml(x.color||'')+' · '+escapeHtml(x.sizes||'')+'</div><p>'+escapeHtml(x.description||'')+'</p><div class="price">₹'+Number(x.price).toLocaleString('en-IN')+'</div><div class="muted">'+(Number(x.stock)>0?'Available to enquire':'Currently unavailable')+'</div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Hello IHS, I am interested in '+x.name+' (₹'+x.price+'), colour '+(x.color||'not specified')+', size '+(x.sizes||'please advise')+'. Please confirm availability and shipping.')+'">Enquire</a></div>';el.append(photo,info);grid.append(el)}}function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.querySelectorAll('#search,#category,#sort').forEach(x=>x.addEventListener('input',render));render();
</script></body></html>
