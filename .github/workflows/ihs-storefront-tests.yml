name: IHS storefront smoke tests
on:
  push:
    branches: [fresh-storefront]
    paths:
      - "fresh-storefront/**"
      - ".github/workflows/ihs-storefront-tests.yml"
  pull_request:
    paths:
      - "fresh-storefront/**"
      - ".github/workflows/ihs-storefront-tests.yml"
  workflow_dispatch:
jobs:
  static-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate storefront files, navigation, configuration and schema
        run: node fresh-storefront/tests/smoke-test.mjs
