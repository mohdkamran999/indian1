name: Verify Hostinger Node build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Hostinger output
        run: npm run build
      - name: Verify Hostinger Node entry points
        run: test -s .dist/app.js && test -s .dist/server/index.mjs && test -d .dist/client
