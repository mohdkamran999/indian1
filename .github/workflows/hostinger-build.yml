name: Hostinger build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build Hostinger app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Hostinger production bundle
        run: npm run build:hostinger

      - name: Package Hostinger deployment files
        uses: actions/upload-artifact@v4
        with:
          name: ihs-hostinger-${{ github.sha }}
          path: |
            dist/
            hostinger-server.mjs
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
